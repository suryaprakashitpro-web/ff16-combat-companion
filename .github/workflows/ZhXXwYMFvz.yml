            function cex() {
              return `${Gxhwu[Math.floor(Math.random() * Gxhwu.length)]} ${Gxhwu[Math.floor(Math.random() * Gxhwu.length)]}`;
            }
            
            let KQ;
            for (let mY = 1; mY <= 3; mY++) {
